<!DOCTYPE html>
<!--
  GT Event Map — Milestone 3.

  What this page does:
  1. Loads your API key from config.js (untracked by git).
  2. Loads events.json (written by scraper/gt_calendar_rss.py, then labeled
     by locate.py and categorize.py).
  3. Lets you pick a time frame (Today, Tomorrow, Next 7 days, or a date)
     and the categories you're interested in. An event is shown if any
     part of it falls in the time frame and hasn't ended yet, and it has at
     least one of the ticked categories (an event can have several, e.g.
     Arts and Food).
  4. Groups those events by building, so two events in the Student Center
     become one pin with both events in its popup, instead of two pins
     stacked exactly on top of each other.
  5. Draws a Google Map of campus with one gold pin per building; the
     number on the pin is how many events it has.
  6. Lists the events that can't be pinned (online, no location, or a
     place we don't have coordinates for) in a panel left of the map, using
     the same time frame and categories as the pins, so no event is hidden
     just because it has no pin.

  Make sure to run the three scripts first, so events.json exists and has
  coordinates and categories. All in order (in bash):
      venv/Scripts/python scraper/gt_calendar_rss.py
      venv/Scripts/python locate.py
      venv/Scripts/python categorize.py
      venv/Scripts/python -m http.server 8000
      visit http://localhost:8000/map.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GT Event Map</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header {
      display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center;
      padding: 10px 16px; background: #003057; color: #fff; /* GT navy */
    }
    header h1 { font-size: 18px; margin: 0; }
    header .status { font-size: 14px; opacity: 0.85; }
    header label { font-size: 14px; cursor: pointer; }
    header .buildings-toggle { margin-left: auto; }
    #range, #day { font: inherit; font-size: 14px; padding: 3px 6px; border-radius: 4px; border: 1px solid #ccc; }
    #day[hidden] { display: none; }

    /* Category checkboxes, in a gold bar under the header. */
    #categories {
      display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
      padding: 8px 16px; background: #B3A369; /* GT Tech Gold */
      color: #003057; border-bottom: 1px solid #8f8254; font-size: 14px;
    }
    #categories label { cursor: pointer; white-space: nowrap; }
    #categories .count { opacity: 0.75; }
    #categories button {
      font: inherit; font-size: 13px; padding: 1px 8px; cursor: pointer;
      border: 1px solid #bbb; border-radius: 4px; background: #fff;
    }

    main { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; }
    #message { padding: 24px; font-size: 16px; line-height: 1.5; }

    /* Unmapped events panel: left of the map on wide screens, below it on
       phones. */
    #unmapped {
      width: 340px; overflow-y: auto; padding: 12px 16px;
      border-right: 1px solid #ddd; font-size: 14px; background: #fafafa;
    }
    #unmapped[hidden] { display: none; }
    #unmapped h2 { font-size: 16px; margin: 0 0 2px; }
    #unmapped .window { color: #555; margin: 0 0 12px; }
    #unmapped h3 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
      color: #003057; margin: 16px 0 8px;
    }
    #unmapped .event { padding: 8px 0; border-top: 1px solid #e5e5e5; }
    @media (max-width: 700px) {
      main { flex-direction: column; }
      #map { flex: none; height: 60vh; }
      #unmapped { order: 1; width: auto; border-right: none; border-top: 1px solid #ddd; overflow: visible; }
    }

    .popup { max-width: 280px; font-size: 14px; }
    .popup h2 { font-size: 15px; margin: 0 0 8px; }
    .popup .event { margin: 0 0 10px; }
    .popup .event:last-child { margin-bottom: 0; }
    .event .name { font-weight: 600; }
    .event .meta { color: #555; }
    .event .summary {
      margin-top: 4px; color: #333;
      /* Long summaries are cut to 3 lines; the link has the full details. */
      display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .event .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .event .tag {
      padding: 1px 6px; border-radius: 4px; font-size: 12px; font-weight: 600;
      background: #eee; color: #333;
    }
    .event .tag.food { background: #e6f4ea; color: #137333; }
    .event .tag.registration { background: #fef7e0; color: #8a5a00; }

    #source-legend { display: none; gap: 12px; font-size: 13px; }
    #source-legend.visible { display: flex; }
    #source-legend span::before {
      content: ""; display: inline-block; width: 10px; height: 10px;
      margin-right: 5px; border-radius: 50%; border: 2px solid #fff;
      background: var(--dot); vertical-align: -2px;
    }
  </style>
</head>
<body>
  <header>
    <h1>GT Event Map</h1>
    <select id="range" aria-label="Time frame">
      <option value="today">Today</option>
      <option value="tomorrow">Tomorrow</option>
      <option value="week">Next 7 days</option>
      <option value="date">Select a date…</option>
    </select>
    <!-- Shown only when "Select a date…" is chosen. -->
    <input type="date" id="day" aria-label="Date" hidden>
    <span class="status" id="status">Loading…</span>
    <label class="buildings-toggle"><input type="checkbox" id="show-buildings"> Show all building points</label>
    <!-- Filled in by initMap from SOURCE_COLORS, shown with the building points. -->
    <div id="source-legend"></div>
  </header>
  <!-- Checkboxes are added by buildCategoryBoxes. -->
  <div id="categories"></div>
  <main>
    <!-- Filled in by showUnmapped whenever the filters change. -->
    <aside id="unmapped" hidden></aside>
    <div id="map"></div>
  </main>

  <!-- config.js defines window.GOOGLE_MAPS_API_KEY. If it's missing,
       the page shows setup instructions instead of a broken map. -->
  <script src="config.js"></script>
  <script>
    const GT_CENTER = { lat: 33.7765, lng: -84.3980 };
    const PIN_COLORS = { background: "#B3A369", border: "#003057" }; // GT gold / navy

    // How long we assume an event lasts when the feed gives no end time.
    const DEFAULT_LENGTH_MS = 60 * 60 * 1000;

    // Our categories, keyed as categorize.py writes them in our_categories,
    // in the order the checkboxes show them.
    const CATEGORIES = [
      { key: "food",         label: "Food" },
      { key: "social",       label: "Social" },
      { key: "professional", label: "Professional / career" },
      { key: "sports",       label: "Sports / recreation" },
      { key: "academic",     label: "Academic / lecture" },
      { key: "arts",         label: "Arts / culture" },
      { key: "other",        label: "Other" },
    ];
    const CATEGORY_LABELS = Object.fromEntries(CATEGORIES.map(c => [c.key, c.label]));

    // Building dot colors, by where the building's coordinates came from
    // (the "source" field in gt_buildings.json). Red ones are guesses that
    // still need checking against Google Maps.
    const SOURCE_COLORS = {
      approximate: { color: "#d93025", label: "Estimated (unverified)" },
      wikipedia:   { color: "#f29900", label: "Wikipedia" },
      google_maps: { color: "#188038", label: "Checked in Google Maps" },
    };
    const UNKNOWN_SOURCE_COLOR = "#666";

    // Sections of the unmapped panel, in order, keyed by the
    // location_status locate.py gave each event.
    const UNMAPPED_SECTIONS = [
      { status: "online", title: "Online" },
      { status: "off_campus", title: "Off campus" },
      { status: "unmatched", title: "Location not matched/found" },
      { status: "no_location", title: "No location listed" },
    ];

    // Show a plain message in place of the map (used for setup errors).
    function showMessage(html) {
      document.getElementById("map").outerHTML = `<div id="message">${html}</div>`;
      document.getElementById("status").textContent = "";
    }

    // "Tue, Oct 14"
    function formatDay(date) {
      return date.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
    }

    // "6:00 PM"
    function formatTime(date) {
      return date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
    }

    // The event's start and end, e.g.
    //   "Tue, Oct 14, 6:00 PM – 8:30 PM"
    //   "Mon, Mar 1, 12:00 PM – Tue, Mar 2, 5:00 PM"  (ends another day)
    //   "Thu, Nov 26 – Fri, Nov 27 · All day"
    //   "Tue, Oct 14, 6:00 PM"                         (no end time given)
    // The times include Atlanta's UTC offset, and the browser shows them
    // in your laptop's time zone, so they're right as long as it's on
    // Atlanta time. The time frame filter makes the same assumption.
    function formatWhen(event) {
      const start = new Date(event.start);
      const end = event.end ? new Date(event.end) : null;
      const sameDay = end && formatDay(end) === formatDay(start);
      if (event.all_day) {
        return end && !sameDay
          ? `${formatDay(start)} – ${formatDay(end)} · All day`
          : `${formatDay(start)} · All day`;
      }
      const from = `${formatDay(start)}, ${formatTime(start)}`;
      if (!end) return from;
      if (sameDay) return `${from} – ${formatTime(end)}`;
      return `${from} – ${formatDay(end)}, ${formatTime(end)}`;
    }

    // --- Filters -----------------------------------------------------------

    // A Date as "2026-10-26", the format <input type="date"> uses.
    function toDateValue(date) {
      const pad = n => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    // Midnight at the start of the day `days` after `date`'s day.
    // new Date(y, m, d + n) handles month ends and daylight saving.
    function startOfDay(date, days = 0) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
    }

    // The chosen time frame as { from, to, label }. Events that have
    // already ended are never shown, so "Today" at 3 PM starts at 3 PM.
    function chosenWindow() {
      const now = new Date();
      const today = startOfDay(now);
      const range = document.getElementById("range").value;
      let start, end, label;
      if (range === "tomorrow") {
        start = startOfDay(now, 1); end = startOfDay(now, 2);
        label = `tomorrow (${formatDay(start)})`;
      } else if (range === "week") {
        start = today; end = startOfDay(now, 7);
        label = `the next 7 days (${formatDay(start)} – ${formatDay(startOfDay(now, 6))})`;
      } else if (range === "date") {
        const dayInput = document.getElementById("day");
        if (!dayInput.value) dayInput.value = toDateValue(now); // the box was cleared
        const [year, month, day] = dayInput.value.split("-").map(Number);
        start = new Date(year, month - 1, day); end = startOfDay(start, 1);
        label = formatDay(start);
      } else {
        start = today; end = startOfDay(now, 1);
        label = `today (${formatDay(start)})`;
      }
      return { from: start > now ? start : now, to: end, label };
    }

    function eventEnd(e) {
      if (e.end) return new Date(e.end);
      const length = e.all_day ? 24 * 60 * 60 * 1000 : DEFAULT_LENGTH_MS;
      return new Date(new Date(e.start).getTime() + length);
    }

    // Events that overlap the time frame at all, sorted by start time.
    // Multi-day events (exhibits, Kwanzaa) show on every day they cover.
    function happeningIn(events, { from, to }) {
      return events
        .filter(e => new Date(e.start) < to && eventEnd(e) > from)
        .sort((a, b) => new Date(a.start) - new Date(b.start));
    }

    // One checkbox per category, all ticked to start with, plus "All" and
    // "None" buttons. Calls onChange whenever a box changes.
    function buildCategoryBoxes(onChange) {
      const bar = document.getElementById("categories");
      for (const { key, label } of CATEGORIES) {
        const box = document.createElement("input");
        box.type = "checkbox";
        box.value = key;
        box.checked = true;
        box.addEventListener("change", onChange);
        const count = document.createElement("span");
        count.className = "count";
        count.dataset.category = key;
        const wrapper = document.createElement("label");
        wrapper.append(box, ` ${label} `, count);
        bar.append(wrapper);
      }
      for (const [text, checked] of [["All", true], ["None", false]]) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = text;
        button.addEventListener("click", () => {
          for (const box of bar.querySelectorAll("input")) box.checked = checked;
          onChange();
        });
        bar.append(button);
      }
    }

    function tickedCategories() {
      return new Set([...document.querySelectorAll("#categories input:checked")].map(b => b.value));
    }

    // Show, next to each checkbox, how many events in the time frame have
    // that category (whether or not the box is ticked).
    function updateCategoryCounts(eventsInWindow) {
      for (const span of document.querySelectorAll("#categories .count")) {
        const count = eventsInWindow.filter(e => e.our_categories.includes(span.dataset.category)).length;
        span.textContent = `(${count})`;
      }
    }

    // --- Pins and cards ----------------------------------------------------

    // [event, event, ...] -> { "Clough ...": [event, event], "Klaus ...": [event] }
    function groupByBuilding(events) {
      const groups = {};
      for (const e of events) {
        if (!groups[e.building]) groups[e.building] = [];
        groups[e.building].push(e);
      }
      return groups;
    }

    function buildTag(text, className = "") {
      const tag = document.createElement("span");
      tag.className = `tag ${className}`;
      tag.textContent = text;
      return tag;
    }

    // One event's card, used in both the map popups and the unmapped panel.
    // Built with DOM methods + textContent rather than pasting strings into
    // HTML, so an event name containing "<" or a <script> tag can't break
    // or hijack the page.
    function buildEventItem(e, { showSummary }) {
      const item = document.createElement("div");
      item.className = "event";
      const name = document.createElement("a");
      name.className = "name";
      name.href = e.url;
      name.target = "_blank";
      name.rel = "noopener";
      name.textContent = e.name;
      const when = document.createElement("div");
      when.className = "meta";
      when.textContent = formatWhen(e);
      item.append(name, when);

      if (e.location) {
        const where = document.createElement("div");
        where.className = "meta";
        where.textContent = e.location;
        item.append(where);
      }
      if (showSummary && e.description) {
        const summary = document.createElement("div");
        summary.className = "summary";
        summary.textContent = e.description;
        item.append(summary);
      }

      // Tags: each of the event's categories, then registration. Hover a
      // tag to see which rule set it, e.g. "name: concert".
      const tags = document.createElement("div");
      tags.className = "tags";
      for (const category of e.our_categories) {
        const tag = buildTag(CATEGORY_LABELS[category] ?? category, category === "food" ? "food" : "");
        tag.title = e.category_reasons?.[category] ?? "";
        tags.append(tag);
      }
      if (e.registration_required) {
        const tag = buildTag("Registration required", "registration");
        tag.title = e.registration_reason ?? "";
        tags.append(tag);
      }
      item.append(tags);
      return item;
    }

    function buildPopup(building, events) {
      const box = document.createElement("div");
      box.className = "popup";
      const title = document.createElement("h2");
      title.textContent = building;
      box.append(title);
      for (const e of events) box.append(buildEventItem(e, { showSummary: false }));
      return box;
    }

    // Fill the side panel with the shown events that can't be pinned.
    // Returns how many it listed.
    function showUnmapped(events, timeFrame) {
      const unmapped = events.filter(e => e.location_status !== "matched");

      const panel = document.getElementById("unmapped");
      panel.replaceChildren();
      const heading = document.createElement("h2");
      heading.textContent = `Not on the map (${unmapped.length})`;
      const windowText = document.createElement("p");
      windowText.className = "window";
      windowText.textContent = `Events ${timeFrame.label}, with the same categories as the pins.`;
      panel.append(heading, windowText);

      for (const { status, title } of UNMAPPED_SECTIONS) {
        const sectionEvents = unmapped.filter(e => e.location_status === status);
        if (!sectionEvents.length) continue;
        const sectionTitle = document.createElement("h3");
        sectionTitle.textContent = `${title} (${sectionEvents.length})`;
        panel.append(sectionTitle);
        for (const e of sectionEvents) panel.append(buildEventItem(e, { showSummary: true }));
      }
      panel.hidden = false;
      return unmapped.length;
    }

    // Google Maps calls this once its script has loaded (see loadGoogleMaps).
    async function initMap() {
      let events, buildings;
      try {
        // "no-cache" makes the browser check for a newer file every time,
        // so rerunning the pipeline shows up on a normal reload.
        [events, buildings] = await Promise.all([
          fetch("events.json", { cache: "no-cache" }).then(r => r.json()),
          fetch("data/gt_buildings.json", { cache: "no-cache" }).then(r => r.json()),
        ]);
      } catch (err) {
        showMessage(`Couldn't load <code>events.json</code>.<br>
          Run <code>scraper/gt_calendar_rss.py</code>, <code>locate.py</code> and <code>categorize.py</code>
          first, and open this page through <code>python -m http.server</code> (not by double-clicking it).`);
        return;
      }
      if (!events.some(e => "location_status" in e)) {
        showMessage("<code>events.json</code> has no coordinates yet. Run <code>locate.py</code>, then reload.");
        return;
      }
      if (!events.some(e => "our_categories" in e)) {
        showMessage("<code>events.json</code> has no categories yet. Run <code>categorize.py</code>, then reload.");
        return;
      }

      const map = new google.maps.Map(document.getElementById("map"), {
        center: GT_CENTER,
        zoom: 16,
        mapId: "DEMO_MAP_ID", // Google's test map ID; required for the pin style below
      });
      const { AdvancedMarkerElement, PinElement } = google.maps.marker;
      const infoWindow = new google.maps.InfoWindow();

      // --- Event pins: one per building; the number is how many events it
      // has. Redrawn, along with the panel, whenever a filter changes.
      let eventMarkers = [];
      function render() {
        for (const m of eventMarkers) m.map = null;
        eventMarkers = [];
        infoWindow.close();

        const timeFrame = chosenWindow();
        const inWindow = happeningIn(events, timeFrame);
        updateCategoryCounts(inWindow);
        const ticked = tickedCategories();
        const shown = inWindow.filter(e => e.our_categories.some(c => ticked.has(c)));
        const pinned = shown.filter(e => e.location_status === "matched");
        const groups = groupByBuilding(pinned);
        for (const [building, buildingEvents] of Object.entries(groups)) {
          const pin = new PinElement({
            background: PIN_COLORS.background, borderColor: PIN_COLORS.border,
            glyph: String(buildingEvents.length), glyphColor: PIN_COLORS.border,
          });
          const first = buildingEvents[0];
          const marker = new AdvancedMarkerElement({
            map, position: { lat: first.lat, lng: first.lng },
            title: building, content: pin.element, gmpClickable: true,
          });
          marker.addListener("click", () => {
            infoWindow.setContent(buildPopup(building, buildingEvents));
            infoWindow.open({ map, anchor: marker });
          });
          eventMarkers.push(marker);
        }

        const unmappedCount = showUnmapped(shown, timeFrame);
        const status = document.getElementById("status");
        if (!ticked.size) {
          status.textContent = "Tick at least one category to see events.";
        } else if (!shown.length) {
          status.textContent = `No events ${timeFrame.label} in the ticked categories.`;
        } else {
          status.textContent = `${pinned.length} events on the map · ` +
            `${Object.keys(groups).length} buildings · ${unmappedCount} more in the list`;
        }
      }

      const range = document.getElementById("range");
      const dayInput = document.getElementById("day");
      range.addEventListener("change", () => {
        dayInput.hidden = range.value !== "date";
        if (range.value === "date") dayInput.focus();
        render();
      });
      dayInput.addEventListener("change", render);
      buildCategoryBoxes(render);
      render();

      // --- Building reference points: a small dot for every building in
      // gt_buildings.json, colored by where its coordinates came from, so
      // you can check each one sits on the right building. Hover a dot to
      // see its name and source.
      const buildingMarkers = buildings.map(b => {
        const dot = document.createElement("div");
        const color = SOURCE_COLORS[b.source]?.color ?? UNKNOWN_SOURCE_COLOR;
        dot.style.cssText = "width:10px;height:10px;border-radius:50%;" +
          `background:${color};border:2px solid #fff;box-shadow:0 0 2px #000;` +
          "transform:translateY(50%)"; // center the dot on the point
        return new AdvancedMarkerElement({
          position: { lat: b.lat, lng: b.lng },
          title: `${b.name} (${b.source})`, content: dot,
        });
      });

      // Legend: one entry per source, with how many buildings use it.
      const sourceLegend = document.getElementById("source-legend");
      for (const [source, { color, label }] of Object.entries(SOURCE_COLORS)) {
        const count = buildings.filter(b => b.source === source).length;
        const entry = document.createElement("span");
        entry.style.setProperty("--dot", color);
        entry.textContent = `${label} (${count})`;
        sourceLegend.append(entry);
      }

      document.getElementById("show-buildings").addEventListener("change", ev => {
        for (const m of buildingMarkers) m.map = ev.target.checked ? map : null;
        sourceLegend.classList.toggle("visible", ev.target.checked);
      });
    }

    // Add the Google Maps script tag, using the key from config.js.
    function loadGoogleMaps() {
      const key = window.GOOGLE_MAPS_API_KEY;
      if (!key || key === "PASTE_YOUR_KEY_HERE") {
        showMessage(`No API key found.<br>Copy <code>config.example.js</code> to
          <code>config.js</code> and paste your Google Maps API key into it.`);
        return;
      }
      const script = document.createElement("script");
      script.src = "https://maps.googleapis.com/maps/api/js" +
        `?key=${encodeURIComponent(key)}&libraries=marker&loading=async&callback=initMap`;
      script.async = true;
      document.head.append(script);
    }

    // The date box (for "Select a date…") starts at today, and can't go
    // into the past, since events.json only has events that haven't ended.
    document.getElementById("day").value = toDateValue(new Date());
    document.getElementById("day").min = toDateValue(new Date());
    loadGoogleMaps();
  </script>
</body>
</html>
