<!DOCTYPE html>
<!--
  GT Event Map — Milestone 2.

  What this page does:
  1. Loads your API key from config.js (untracked by git).
  2. Loads events.json (written by scraper/gt_calendar_rss.py, then labeled by locate.py).
  3. Keeps only events that matched a building and haven't ended yet,
     sorts them by start time, and takes the next 10.
  4. Groups those events by building, so two events in the Student Center
     become one pin with both events in its popup, instead of two pins
     stacked exactly on top of each other.
  5. Draws a Google Map of campus with one pin per building.
  6. Lists the events that can't be pinned (online, no location, or a
     place we don't have coordinates for) in a panel beside the map, for
     the same time frame as the pins, so no event is hidden just because
     it has no pin.

  Make sure to run scraper/gt_calendar_rss.py and locate.py first, so
  events.json exists and has coordinates. All in order (in bash):
      venv/Scripts/python scraper/gt_calendar_rss.py
      venv/Scripts/python locate.py
      venv/Scripts/python -m http.server 8000
      visit http://localhost:8000/map.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GT Event Map</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header {
      display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center;
      padding: 10px 16px; background: #003057; color: #fff; /* GT navy */
    }
    header h1 { font-size: 18px; margin: 0; }
    header .status { font-size: 14px; opacity: 0.85; }
    header label { font-size: 14px; margin-left: auto; cursor: pointer; }
    main { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; }
    #message { padding: 24px; font-size: 16px; line-height: 1.5; }

    /* Unmapped events panel: beside the map on wide screens, below it on
       phones. */
    #unmapped {
      width: 340px; overflow-y: auto; padding: 12px 16px;
      border-left: 1px solid #ddd; font-size: 14px; background: #fafafa;
    }
    #unmapped[hidden] { display: none; }
    #unmapped h2 { font-size: 16px; margin: 0 0 2px; }
    #unmapped .window { color: #555; margin: 0 0 12px; }
    #unmapped h3 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
      color: #003057; margin: 16px 0 8px;
    }
    #unmapped .event { padding: 8px 0; border-top: 1px solid #e5e5e5; }
    @media (max-width: 700px) {
      main { flex-direction: column; }
      #map { flex: none; height: 60vh; }
      #unmapped { width: auto; border-left: none; border-top: 1px solid #ddd; overflow: visible; }
    }

    .popup { max-width: 280px; font-size: 14px; }
    .popup h2 { font-size: 15px; margin: 0 0 8px; }
    .popup .event { margin: 0 0 10px; }
    .popup .event:last-child { margin-bottom: 0; }
    .event .name { font-weight: 600; }
    .event .meta { color: #555; }
    .event .summary {
      margin-top: 4px; color: #333;
      /* Long summaries are cut to 3 lines; the link has the full details. */
      display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .event .tag {
      display: inline-block; margin-top: 4px; padding: 1px 6px; border-radius: 4px;
      background: #e6f4ea; color: #137333; font-size: 12px; font-weight: 600;
    }
    #legend { display: none; gap: 12px; font-size: 13px; }
    #legend.visible { display: flex; }
    #legend span::before {
      content: ""; display: inline-block; width: 10px; height: 10px;
      margin-right: 5px; border-radius: 50%; border: 2px solid #fff;
      background: var(--dot); vertical-align: -2px;
    }
  </style>
</head>
<body>
  <header>
    <h1>GT Event Map</h1>
    <span class="status" id="status">Loading…</span>
    <label><input type="checkbox" id="show-buildings"> Show all building points</label>
    <!-- Filled in by initMap from SOURCE_COLORS, shown with the building points. -->
    <div id="legend"></div>
  </header>
  <main>
    <div id="map"></div>
    <!-- Filled in by showUnmapped once the events have loaded. -->
    <aside id="unmapped" hidden></aside>
  </main>

  <!-- config.js defines window.GOOGLE_MAPS_API_KEY. If it's missing,
       the page shows setup instructions instead of a broken map. -->
  <script src="config.js"></script>
  <script>
    const GT_CENTER = { lat: 33.7765, lng: -84.3980 };
    const EVENTS_TO_SHOW = 10;

    // Building dot colors, by where the building's coordinates came from
    // (the "source" field in gt_buildings.json). Red ones are guesses that
    // still need checking against Google Maps.
    const SOURCE_COLORS = {
      approximate: { color: "#d93025", label: "Estimated (unverified)" },
      wikipedia:   { color: "#f29900", label: "Wikipedia" },
      google_maps: { color: "#188038", label: "Checked in Google Maps" },
    };
    const UNKNOWN_SOURCE_COLOR = "#666";

    // Sections of the unmapped panel, in order, keyed by the
    // location_status locate.py gave each event.
    const UNMAPPED_SECTIONS = [
      { status: "online", title: "Online" },
      { status: "off_campus", title: "Off campus" },
      { status: "unmatched", title: "Location not on the map" },
      { status: "no_location", title: "No location listed" },
    ];

    // Show a plain message in place of the map (used for setup errors).
    function showMessage(html) {
      document.getElementById("map").outerHTML = `<div id="message">${html}</div>`;
      document.getElementById("status").textContent = "";
    }

    // "2026-10-14T18:00:00-04:00" -> "Tue, Oct 14, 6:00 PM" (or "All day").
    // The times include Atlanta's UTC offset, and the browser shows them
    // in your laptop's time zone, so they're right as long as it's on
    // Atlanta time.
    function formatWhen(event) {
      const date = new Date(event.start);
      const day = date.toLocaleDateString("en-US",
        { weekday: "short", month: "short", day: "numeric" });
      if (event.all_day) return `${day} · All day`;
      const time = date.toLocaleTimeString("en-US",
        { hour: "numeric", minute: "2-digit" });
      return `${day}, ${time}`;
    }

    // Events that haven't ended yet, sorted by start time.
    function notEnded(events) {
      const now = new Date();
      return events
        .filter(e => new Date(e.end || e.start) >= now)
        .sort((a, b) => new Date(a.start) - new Date(b.start));
    }

    // Pick the next N located events. If more events start at the same
    // time as the Nth one, they're all included, so none get cut off.
    function pickUpcoming(events, count) {
      const located = notEnded(events).filter(e => e.location_status === "matched");
      if (located.length <= count) return located;
      const lastStart = new Date(located[count - 1].start);
      return located.filter(e => new Date(e.start) <= lastStart);
    }

    // [event, event, ...] -> { "Clough ...": [event, event], "Klaus ...": [event] }
    function groupByBuilding(events) {
      const groups = {};
      for (const e of events) {
        if (!groups[e.building]) groups[e.building] = [];
        groups[e.building].push(e);
      }
      return groups;
    }

    // One event's card, used in both the map popups and the unmapped panel.
    // Built with DOM methods + textContent rather than pasting strings into
    // HTML, so an event name containing "<" or a <script> tag can't break
    // or hijack the page.
    function buildEventItem(e, { showSummary }) {
      const item = document.createElement("div");
      item.className = "event";
      const name = document.createElement("a");
      name.className = "name";
      name.href = e.url;
      name.target = "_blank";
      name.rel = "noopener";
      name.textContent = e.name;
      const when = document.createElement("div");
      when.className = "meta";
      when.textContent = formatWhen(e);
      item.append(name, when);

      if (e.location) {
        const where = document.createElement("div");
        where.className = "meta";
        where.textContent = e.location;
        item.append(where);
      }
      if (showSummary && e.description) {
        const summary = document.createElement("div");
        summary.className = "summary";
        summary.textContent = e.description;
        item.append(summary);
      }
      if (e.free_food) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "Free food";
        item.append(tag);
      }
      return item;
    }

    function buildPopup(building, events) {
      const box = document.createElement("div");
      box.className = "popup";
      const title = document.createElement("h2");
      title.textContent = building;
      box.append(title);
      for (const e of events) box.append(buildEventItem(e, { showSummary: false }));
      return box;
    }

    // Fill the side panel with the events that can't be pinned, for the
    // same time frame as the pins: everything that hasn't ended and starts
    // no later than the last pinned event. Returns how many it listed.
    function showUnmapped(events, pinned) {
      const windowEnd = pinned.length
        ? new Date(pinned[pinned.length - 1].start)
        : null; // no pins at all: list every upcoming unmapped event
      const unmapped = notEnded(events).filter(e =>
        e.location_status !== "matched" &&
        (windowEnd === null || new Date(e.start) <= windowEnd));

      const panel = document.getElementById("unmapped");
      const heading = document.createElement("h2");
      heading.textContent = `Not on the map (${unmapped.length})`;
      const timeFrame = document.createElement("p");
      timeFrame.className = "window";
      timeFrame.textContent = windowEnd
        ? `Events through ${formatWhen({ start: pinned[pinned.length - 1].start })}, the same time frame as the pins.`
        : "All upcoming events that can't be pinned.";
      panel.append(heading, timeFrame);

      for (const { status, title } of UNMAPPED_SECTIONS) {
        const sectionEvents = unmapped.filter(e => e.location_status === status);
        if (!sectionEvents.length) continue;
        const sectionTitle = document.createElement("h3");
        sectionTitle.textContent = `${title} (${sectionEvents.length})`;
        panel.append(sectionTitle);
        for (const e of sectionEvents) panel.append(buildEventItem(e, { showSummary: true }));
      }
      panel.hidden = false;
      return unmapped.length;
    }

    // Google Maps calls this once its script has loaded (see loadGoogleMaps).
    async function initMap() {
      let events, buildings;
      try {
        [events, buildings] = await Promise.all([
          fetch("events.json").then(r => r.json()),
          fetch("data/gt_buildings.json").then(r => r.json()),
        ]);
      } catch (err) {
        showMessage(`Couldn't load <code>events.json</code>.<br>
          Run <code>scraper/gt_calendar_rss.py</code> and <code>locate.py</code> first, and open this page
          through <code>python -m http.server</code> (not by double-clicking it).`);
        return;
      }
      if (!events.some(e => "location_status" in e)) {
        showMessage("<code>events.json</code> has no coordinates yet. Run <code>locate.py</code>, then reload.");
        return;
      }

      const map = new google.maps.Map(document.getElementById("map"), {
        center: GT_CENTER,
        zoom: 16,
        mapId: "DEMO_MAP_ID", // Google's test map ID; required for the pin style below
      });
      const { AdvancedMarkerElement, PinElement } = google.maps.marker;
      const infoWindow = new google.maps.InfoWindow();

      // --- Event pins: one per building; the number is how many events it has.
      const upcoming = pickUpcoming(events, EVENTS_TO_SHOW);
      const groups = groupByBuilding(upcoming);
      for (const [building, buildingEvents] of Object.entries(groups)) {
        const first = buildingEvents[0];
        const pin = new PinElement({
          background: "#B3A369", borderColor: "#003057", // GT gold / navy
          glyph: String(buildingEvents.length), glyphColor: "#003057",
        });
        const marker = new AdvancedMarkerElement({
          map, position: { lat: first.lat, lng: first.lng },
          title: building, content: pin.element, gmpClickable: true,
        });
        marker.addListener("click", () => {
          infoWindow.setContent(buildPopup(building, buildingEvents));
          infoWindow.open({ map, anchor: marker });
        });
      }

      const unmappedCount = showUnmapped(events, upcoming);
      document.getElementById("status").textContent = upcoming.length
        ? `Next ${upcoming.length} events on the map · ${Object.keys(groups).length} buildings · ${unmappedCount} more in the list`
        : "No upcoming mappable events. Re-run scraper/gt_calendar_rss.py and locate.py for fresh data.";

      // --- Building reference points: a small dot for every building in
      // gt_buildings.json, colored by where its coordinates came from, so
      // you can check each one sits on the right building. Hover a dot to
      // see its name and source.
      const buildingMarkers = buildings.map(b => {
        const dot = document.createElement("div");
        const color = SOURCE_COLORS[b.source]?.color ?? UNKNOWN_SOURCE_COLOR;
        dot.style.cssText = "width:10px;height:10px;border-radius:50%;" +
          `background:${color};border:2px solid #fff;box-shadow:0 0 2px #000;` +
          "transform:translateY(50%)"; // center the dot on the point
        return new AdvancedMarkerElement({
          position: { lat: b.lat, lng: b.lng },
          title: `${b.name} (${b.source})`, content: dot,
        });
      });

      // Legend: one entry per source, with how many buildings use it.
      const legend = document.getElementById("legend");
      for (const [source, { color, label }] of Object.entries(SOURCE_COLORS)) {
        const count = buildings.filter(b => b.source === source).length;
        const entry = document.createElement("span");
        entry.style.setProperty("--dot", color);
        entry.textContent = `${label} (${count})`;
        legend.append(entry);
      }

      document.getElementById("show-buildings").addEventListener("change", ev => {
        for (const m of buildingMarkers) m.map = ev.target.checked ? map : null;
        legend.classList.toggle("visible", ev.target.checked);
      });
    }

    // Add the Google Maps script tag, using the key from config.js.
    function loadGoogleMaps() {
      const key = window.GOOGLE_MAPS_API_KEY;
      if (!key || key === "PASTE_YOUR_KEY_HERE") {
        showMessage(`No API key found.<br>Copy <code>config.example.js</code> to
          <code>config.js</code> and paste your Google Maps API key into it.`);
        return;
      }
      const script = document.createElement("script");
      script.src = "https://maps.googleapis.com/maps/api/js" +
        `?key=${encodeURIComponent(key)}&libraries=marker&loading=async&callback=initMap`;
      script.async = true;
      document.head.append(script);
    }

    loadGoogleMaps();
  </script>
</body>
</html>
