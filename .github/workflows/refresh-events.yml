# Refreshes the event data once a day and publishes it on Firebase Hosting:
#   https://gt-event-map.web.app/events.json
#   https://gt-event-map.web.app/data/gt_buildings.json
#
# If any step fails (e.g. the RSS reader's sanity check finds no events),
# nothing is deployed, the old data stays online, and GitHub emails the
# repo owner about the failed run.
#
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_GT_EVENT_MAP: the JSON
# key of a Google Cloud service account with the roles "Firebase Hosting Admin"
# and "Service Usage Consumer" (the deploy first checks that Hosting is on).

name: Refresh events

on:
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC = 6 AM in Atlanta (5 AM in winter)
  workflow_dispatch:        # "Run workflow" button on the Actions tab

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Read the RSS feeds
        run: python scraper/gt_calendar_rss.py

      - name: Match locations to buildings
        run: python locate.py

      - name: Categorize events
        run: python categorize.py

      - name: Collect the files to publish
        run: |
          mkdir -p public/data
          cp events.json public/
          cp data/gt_buildings.json public/data/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GT_EVENT_MAP }}
          projectId: gt-event-map
          channelId: live
